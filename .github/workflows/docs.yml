name: Publish user guide

on:
  push:
    branches: [develop]
    paths:
      - 'docs/user-guide/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Minimal permissions for GitHub Pages deployment via Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install docs toolchain
        run: pip install -r docs/user-guide/requirements.txt
      - name: Build site
        run: mkdocs build -f docs/user-guide/mkdocs.yml --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/user-guide/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
