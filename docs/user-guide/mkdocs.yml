site_name: Saldo User Guide
site_description: Task-oriented user guide for Saldo, generated from the OpenSpec specs.

docs_dir: content
site_dir: site

theme:
  name: material
  logo: assets/saldo.png
  favicon: assets/saldo.png
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

# Strip the traceability footers from the rendered site (kept in source as metadata).
hooks:
  - hooks/strip_traceability.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  # Material/Octicon icons for the home-page card grid.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The nav below is the one durable hand-blessed artifact. The generator slots new
# task pages here with a soft default; correct placement in PR review.
nav:
  - Home: index.md
  - Getting started:
      - Signing in & your account: signing-in.md
      - Understanding your saldo: understanding-your-saldo.md
  - Daily use:
      - Logging a work day: logging-a-work-day.md
      - Using the clock: using-the-clock.md
      - Recording an absence: recording-an-absence.md
  - Configuration:
      - Account & expected hours: account-and-expected-hours.md
  - Insights:
      - Statistics: statistics.md
