site_name: Saldo User Guide
site_description: Task-oriented user guide for Saldo, generated from the OpenSpec specs.

docs_dir: content
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# The nav below is the one durable hand-blessed artifact. The generator slots new
# task pages here with a soft default; correct placement in PR review.
nav:
  - Home: index.md
